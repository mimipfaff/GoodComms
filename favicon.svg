<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="lb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a6eff"/>
      <stop offset="100%" stop-color="#00bcd4"/>
    </linearGradient>
    <linearGradient id="lg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00bcd4"/>
      <stop offset="100%" stop-color="#22cc55"/>
    </linearGradient>
  </defs>
  <!-- Blue speech bubble (back-left) -->
  <path d="M8,16 Q8,6 18,6 L58,6 Q68,6 68,16 L68,52 Q68,62 58,62 L32,62 L14,76 L20,62 Q8,62 8,52 Z"
    fill="none" stroke="url(#lb)" stroke-width="5" stroke-linejoin="round"/>
  <!-- Green speech bubble (front-right) -->
  <path d="M26,26 Q26,16 36,16 L76,16 Q86,16 86,26 L86,62 Q86,72 76,72 L68,72 L74,86 L56,72 Q26,72 26,62 Z"
    fill="rgba(255,255,255,0.02)" stroke="url(#lg)" stroke-width="5" stroke-linejoin="round"/>
  <!-- Connecting line -->
  <line x1="33" y1="39" x2="67" y2="39" stroke="#6b7280" stroke-width="3" stroke-linecap="round"/>
  <!-- Left dot (blue) -->
  <circle cx="33" cy="39" r="6" fill="#1a6eff"/>
  <!-- Center dot (dark navy) -->
  <circle cx="50" cy="39" r="8" fill="#010956"/>
  <!-- Right dot (green) -->
  <circle cx="67" cy="39" r="6" fill="#22cc55"/>
</svg>
