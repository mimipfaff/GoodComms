<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GoodComms</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f1f5f9;color:#1e293b;min-height:100vh}
    .app-header{background:#343a78;color:#fff;padding:0 24px;display:flex;align-items:center;gap:32px;height:60px;position:sticky;top:0;z-index:50;border-bottom:1px solid #2a2f60}
    .app-logo{height:38px;display:block}
    .nav-tabs{display:flex;gap:4px}
    .nav-tab{background:transparent;border:none;color:rgba(255,255,255,.65);padding:8px 18px;cursor:pointer;border-radius:6px;font-size:.9rem;transition:all .15s}
    .nav-tab:hover{background:rgba(255,255,255,.12);color:#fff}
    .nav-tab.active{background:rgba(255,255,255,.2);color:#fff;font-weight:600}
    .main{padding:24px;max-width:1500px;margin:0 auto}
    .toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
    .toolbar h2{font-size:1.4rem;font-weight:700}
    .controls-bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px;padding:12px 16px;background:#fff;border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.07)}
    .controls-label{font-size:.8rem;font-weight:600;color:#6b7280;white-space:nowrap}
    .controls-sep{width:1px;height:20px;background:#e2e8f0;margin:0 4px}
    .btn{padding:8px 16px;border:none;border-radius:6px;cursor:pointer;font-size:.875rem;font-weight:500;transition:all .15s;display:inline-flex;align-items:center;gap:6px}
    .btn-primary{background:#343a78;color:#fff;border:1px solid #343a78}.btn-primary:hover{background:#2a2f60}
    .btn-success{background:#16a34a;color:#fff}.btn-success:hover{background:#15803d}
    .btn-warning{background:#ea580c;color:#fff}.btn-warning:hover{background:#c2410c}
    .btn-danger{background:#dc2626;color:#fff}.btn-danger:hover{background:#b91c1c}
    .btn-secondary{background:#e2e8f0;color:#475569}.btn-secondary:hover{background:#cbd5e1}
    .btn-ghost{background:transparent;border:1px solid #cbd5e1;color:#475569}.btn-ghost:hover{background:#f1f5f9}
    .btn-edit{background:#eef0ff;color:#010956;border:1px solid #c7cbf0}.btn-edit:hover{background:#d8dcf8}
    .btn-del{background:#fef2f2;color:#dc2626;border:1px solid #fecaca}.btn-del:hover{background:#fee2e2}
    .btn-sm{padding:4px 10px;font-size:.78rem}
    .btn-ncr{background:#f0fdf4;color:#16a34a;border:1px solid #bbf7d0}.btn-ncr:hover{background:#dcfce7}
    .btn-icon{width:28px;height:28px;padding:0;display:inline-flex;align-items:center;justify-content:center;border-radius:6px;border:none;cursor:pointer;flex-shrink:0;transition:all .15s}
    /* ---- List rows ---- */
    .clients-list{display:flex;flex-direction:column;gap:6px}
    .client-row{background:#fff;border-radius:8px;padding:13px 16px;box-shadow:0 1px 3px rgba(0,0,0,.08);display:flex;align-items:center;gap:14px;border-left:4px solid transparent;transition:box-shadow .15s;cursor:pointer}
    .client-row:hover{box-shadow:0 3px 10px rgba(0,0,0,.1)}
    .client-row.row-red{border-left-color:#dc2626}
    .client-row.row-orange{border-left-color:#ea580c}
    .client-row.row-green{border-left-color:#16a34a}
    .row-dot{flex-shrink:0}
    .row-name{flex:0 0 200px;min-width:0}
    .row-client-name{font-size:.95rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .row-badges{display:flex;gap:4px;margin-top:4px;flex-wrap:wrap}
    .row-meter{flex:0 0 160px}
    .row-meter-label{font-size:.7rem;color:#6b7280;margin-bottom:3px;display:flex;justify-content:space-between}
    .row-contact{flex:1;font-size:.8rem;color:#6b7280;min-width:120px}
    .row-contact-val{font-size:.82rem;font-weight:500}
    .row-issues{flex:0 0 90px;font-size:.78rem;color:#6b7280;text-align:center}
    .row-warnings{flex:0 0 160px;display:flex;flex-direction:column;gap:3px}
    .row-actions{flex-shrink:0;display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
    /* ---- Badges ---- */
    .badge{display:inline-flex;align-items:center;padding:2px 7px;border-radius:20px;font-size:.7rem;font-weight:600}
    .badge-size-small{background:#dbeafe;color:#1d4ed8}
    .badge-size-medium{background:#e0e7ff;color:#4338ca}
    .badge-size-large{background:#fce7f3;color:#be185d}
    .badge-size-very_large{background:#fef3c7;color:#b45309}
    .badge-pilot{background:#dcfce7;color:#15803d}
    .badge-client{background:#dbeafe;color:#1d4ed8}
    /* ---- Meter ---- */
    .meter-bar{height:8px;border-radius:4px;background:#e2e8f0;overflow:hidden}
    .meter-fill{height:100%;border-radius:4px;transition:width .3s}
    .meter-green{background:#16a34a}.meter-orange{background:#ea580c}.meter-red{background:#dc2626}
    .meter-grayed .meter-fill{filter:grayscale(1);opacity:.4}
    .meter-grayed .row-meter-label{color:#9ca3af}
    /* ---- Indicators ---- */
    .indicator-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
    .dot-green{background:#16a34a}.dot-orange{background:#ea580c}.dot-red{background:#dc2626}.dot-gray{background:#9ca3af}
    /* ---- Warning tags ---- */
    .warning-tag{display:inline-flex;align-items:center;gap:3px;padding:2px 7px;border-radius:4px;font-size:.68rem;font-weight:600;white-space:nowrap}
    .warning-orange{background:#fff7ed;color:#ea580c;border:1px solid #fed7aa}
    .warning-red{background:#fef2f2;color:#dc2626;border:1px solid #fecaca}
    /* ---- Empty / misc ---- */
    .empty-state{text-align:center;padding:64px 20px;color:#9ca3af}
    .empty-icon{font-size:3rem;margin-bottom:12px}
    /* ---- Modal ---- */
    .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px}
    .modal-overlay.hidden{display:none}
    .modal{background:#fff;border-radius:12px;padding:24px;width:100%;max-height:90vh;overflow-y:auto}
    .modal-sm{max-width:460px}.modal-md{max-width:620px}.modal-lg{max-width:920px}
    .modal-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px}
    .modal-title{font-size:1.1rem;font-weight:700}
    .modal-close{background:none;border:none;font-size:1.6rem;cursor:pointer;color:#6b7280;line-height:1;padding:0 4px}
    .modal-close:hover{color:#1e293b}
    .modal-footer{display:flex;gap:8px;justify-content:flex-end;margin-top:20px;padding-top:16px;border-top:1px solid #f1f5f9}
    /* ---- Forms ---- */
    .form-group{margin-bottom:14px}
    .form-label{display:block;font-size:.875rem;font-weight:600;color:#374151;margin-bottom:5px}
    .form-input,.form-select,.form-textarea{width:100%;padding:8px 12px;border:1px solid #d1d5db;border-radius:6px;font-size:.875rem;outline:none;transition:border-color .15s;font-family:inherit;background:#fff}
    .form-input:focus,.form-select:focus,.form-textarea:focus{border-color:#010956}
    .form-textarea{resize:vertical;min-height:76px}
    .form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
    /* ---- Smiley ---- */
    .smiley-selector{display:flex;gap:5px}
    .smiley-option{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 6px;border:2px solid #e2e8f0;border-radius:8px;cursor:pointer;transition:all .15s;flex:1}
    .smiley-option:hover{border-color:#010956;background:#eef0ff}
    .smiley-option.selected{border-color:#010956;background:#d8dcf8}
    .smiley-emoji{font-size:1.4rem}
    .smiley-label{font-size:.6rem;color:#6b7280;text-align:center;line-height:1.2}
    /* ---- Detail modal ---- */
    .detail-tabs{display:flex;gap:4px;margin-bottom:16px;background:#f1f5f9;padding:4px;border-radius:8px}
    .detail-tab{padding:6px 14px;background:none;border:none;cursor:pointer;border-radius:6px;font-size:.875rem;color:#6b7280}
    .detail-tab.active{background:#fff;color:#1e293b;font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.1)}
    .detail-section-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
    .detail-section-title{font-size:.95rem;font-weight:700;color:#374151}
    .detail-meta-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px;padding:16px;background:#f8fafc;border-radius:8px}
    .meta-label{font-size:.7rem;color:#9ca3af;text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px;font-weight:600}
    .meta-value{font-size:.85rem;color:#1e293b;font-weight:500}
    .contact-item{display:flex;gap:12px;padding:12px;border:1px solid #e2e8f0;border-radius:8px;margin-bottom:8px}
    .contact-icon{width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:1rem;flex-shrink:0}
    .ci-email{background:#dbeafe}.ci-meeting{background:#dcfce7}.ci-call{background:#fce7f3}
    .contact-type-label{font-size:.8rem;font-weight:600;color:#374151;text-transform:capitalize}
    .contact-date-label{font-size:.72rem;color:#9ca3af}
    .contact-details-text{font-size:.78rem;color:#6b7280;margin-top:3px}
    .contact-score-text{font-size:.75rem;color:#64748b;margin-top:3px}
    .item-actions{display:flex;gap:5px;margin-top:8px;flex-wrap:wrap}
    .issue-item{padding:12px;border:1px solid #e2e8f0;border-radius:8px;margin-bottom:8px}
    .issue-item.ov{border-color:#fca5a5;background:#fef2f2}
    .issue-item.resolved-item{opacity:.65}
    .issue-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px;gap:8px}
    .issue-title{font-weight:600;font-size:.88rem}
    .issue-meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
    .urgency-badge{display:inline-flex;padding:2px 7px;border-radius:4px;font-size:.72rem;font-weight:600}
    .u-very_high{background:#fef2f2;color:#dc2626}.u-high{background:#fff7ed;color:#ea580c}
    .u-medium{background:#fefce8;color:#ca8a04}.u-low{background:#f0fdf4;color:#16a34a}.u-very_low{background:#f0f9ff;color:#0284c7}
    .status-open{background:#fff7ed;color:#ea580c}.status-resolved{background:#f0fdf4;color:#16a34a}
    .overdue-label{font-size:.68rem;font-weight:700;color:#dc2626;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}
    .group-label{font-size:.78rem;font-weight:700;margin:14px 0 8px;color:#374151;text-transform:uppercase;letter-spacing:.04em}
    .raised-count{font-size:.72rem;color:#6b7280}
    /* ---- Reports ---- */
    .report-tabs{display:flex;gap:0;margin-bottom:24px;border-bottom:2px solid #e2e8f0}
    .report-tab{padding:10px 22px;background:none;border:none;cursor:pointer;font-size:.9rem;color:#6b7280;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .15s}
    .report-tab.active{color:#010956;border-bottom-color:#010956;font-weight:600}
    .report-card{background:#fff;border-radius:12px;padding:24px;box-shadow:0 1px 3px rgba(0,0,0,.1)}
    .report-controls{display:flex;gap:12px;margin-bottom:20px;align-items:center;flex-wrap:wrap}
    .chart-container{position:relative;height:360px}
    .no-data{text-align:center;padding:24px;color:#9ca3af;font-size:.875rem}
    .text-sm{font-size:.875rem}.text-muted{color:#6b7280}
    .contact-indicator{display:flex;align-items:center;gap:8px;font-size:.82rem;margin-bottom:4px}
    .warnings-inline{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
    @media(max-width:900px){
      .row-warnings{display:none}
      .row-issues{display:none}
    }
    @media(max-width:640px){
      .form-row{grid-template-columns:1fr}
      .row-meter{display:none}
      .detail-meta-grid{grid-template-columns:1fr}
      .smiley-selector{gap:3px}
      .smiley-option{padding:6px 2px}
    }
  </style>
</head>
<body>

<header class="app-header">
  <img src="logo.png" alt="GoodComms" class="app-logo">
  <nav class="nav-tabs">
    <button class="nav-tab active" onclick="switchTab('clients')">Clients</button>
    <button class="nav-tab" onclick="switchTab('reports')">Reports</button>
  </nav>
</header>

<main class="main">
  <!-- Clients Tab -->
  <div id="tab-clients">
    <div class="toolbar">
      <h2>Clients</h2>
      <button class="btn btn-primary" onclick="openAddClientModal()">+ Add Client</button>
    </div>
    <div class="controls-bar">
      <span class="controls-label">Sort:</span>
      <select class="form-select" style="width:190px;padding:5px 10px;font-size:.82rem" onchange="listSort=this.value;renderClients()">
        <option value="default">Default (date added)</option>
        <option value="sat_low">Satisfaction: Lowest first</option>
        <option value="sat_high">Satisfaction: Highest first</option>
        <option value="contact_due">Contact: Due soonest</option>
      </select>
      <div class="controls-sep"></div>
      <span class="controls-label">Size:</span>
      <select class="form-select" style="width:140px;padding:5px 10px;font-size:.82rem" onchange="listFilterSize=this.value;renderClients()">
        <option value="all">All sizes</option>
        <option value="small">Small</option>
        <option value="medium">Medium</option>
        <option value="large">Large</option>
        <option value="very_large">Very Large</option>
      </select>
      <div class="controls-sep"></div>
      <span class="controls-label">Type:</span>
      <select class="form-select" style="width:130px;padding:5px 10px;font-size:.82rem" onchange="listFilterType=this.value;renderClients()">
        <option value="all">All</option>
        <option value="pilot">Pilot</option>
        <option value="client">Client</option>
      </select>
    </div>
    <div id="clients-list" class="clients-list"></div>
  </div>

  <!-- Reports Tab -->
  <div id="tab-reports" style="display:none">
    <div class="toolbar"><h2>Reports</h2></div>
    <div class="report-tabs">
      <button class="report-tab active" onclick="switchReport('satisfaction')">Satisfaction Report</button>
      <button class="report-tab" onclick="switchReport('contact-frequency')">Contact Frequency</button>
    </div>
    <div id="report-content"></div>
  </div>
</main>

<!-- ===== ADD CLIENT ===== -->
<div id="modal-add-client" class="modal-overlay hidden">
  <div class="modal modal-sm">
    <div class="modal-header">
      <h3 class="modal-title">Add New Client</h3>
      <button class="modal-close" onclick="closeModal('add-client')">&times;</button>
    </div>
    <div class="form-group">
      <label class="form-label">Client Name *</label>
      <input type="text" id="inp-client-name" class="form-input" placeholder="Enter client or company name">
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Size *</label>
        <select id="inp-client-size" class="form-select">
          <option value="">Select…</option>
          <option value="small">Small</option>
          <option value="medium">Medium</option>
          <option value="large">Large</option>
          <option value="very_large">Very Large</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Status *</label>
        <select id="inp-client-status" class="form-select">
          <option value="pilot">Pilot</option>
          <option value="client">Client</option>
        </select>
      </div>
    </div>
    <div class="modal-footer">
      <button type="button" class="btn btn-secondary" onclick="closeModal('add-client')">Cancel</button>
      <button type="button" class="btn btn-primary" onclick="saveClient()">Create</button>
    </div>
  </div>
</div>

<!-- ===== EDIT CLIENT ===== -->
<div id="modal-edit-client" class="modal-overlay hidden">
  <div class="modal modal-sm">
    <div class="modal-header">
      <h3 class="modal-title">Edit Client</h3>
      <button class="modal-close" onclick="closeModal('edit-client')">&times;</button>
    </div>
    <div class="form-group">
      <label class="form-label">Client Name *</label>
      <input type="text" id="edit-client-name" class="form-input" placeholder="Client name">
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Size *</label>
        <select id="edit-client-size" class="form-select">
          <option value="small">Small</option>
          <option value="medium">Medium</option>
          <option value="large">Large</option>
          <option value="very_large">Very Large</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Status *</label>
        <select id="edit-client-status" class="form-select">
          <option value="pilot">Pilot</option>
          <option value="client">Client</option>
        </select>
      </div>
    </div>
    <div class="modal-footer">
      <button type="button" class="btn btn-secondary" onclick="closeModal('edit-client')">Cancel</button>
      <button type="button" class="btn btn-primary" onclick="saveEditClient()">Save Changes</button>
    </div>
  </div>
</div>

<!-- ===== CLIENT DETAIL ===== -->
<div id="modal-client-detail" class="modal-overlay hidden">
  <div class="modal modal-lg">
    <div id="client-detail-content"></div>
  </div>
</div>

<!-- ===== ADD CONTACT ===== -->
<div id="modal-add-contact" class="modal-overlay hidden">
  <div class="modal modal-sm">
    <div class="modal-header">
      <h3 class="modal-title">Log Contact</h3>
      <button class="modal-close" onclick="closeModal('add-contact')">&times;</button>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Type *</label>
        <select id="inp-contact-type" class="form-select">
          <option value="">Select…</option>
          <option value="email">Email</option>
          <option value="meeting">Meeting</option>
          <option value="call">Call</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Date *</label>
        <input type="date" id="inp-contact-date" class="form-input">
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">Details <span style="font-weight:400;color:#9ca3af">(optional)</span></label>
      <textarea id="inp-contact-details" class="form-textarea" placeholder="Notes about this contact…"></textarea>
    </div>
    <div class="form-group">
      <label class="form-label">Satisfaction Score *</label>
      <div class="smiley-selector" id="add-smileys">
        <div class="smiley-option" data-score="0" onclick="selectSmiley('add',0)"><span class="smiley-emoji">😞</span><span class="smiley-label">Very Dissatisfied</span></div>
        <div class="smiley-option" data-score="25" onclick="selectSmiley('add',25)"><span class="smiley-emoji">😕</span><span class="smiley-label">Dissatisfied</span></div>
        <div class="smiley-option" data-score="50" onclick="selectSmiley('add',50)"><span class="smiley-emoji">😐</span><span class="smiley-label">Neutral</span></div>
        <div class="smiley-option" data-score="75" onclick="selectSmiley('add',75)"><span class="smiley-emoji">🙂</span><span class="smiley-label">Satisfied</span></div>
        <div class="smiley-option" data-score="100" onclick="selectSmiley('add',100)"><span class="smiley-emoji">😄</span><span class="smiley-label">Very Satisfied</span></div>
      </div>
      <input type="hidden" id="inp-contact-satisfaction">
    </div>
    <div class="modal-footer">
      <button type="button" class="btn btn-secondary" onclick="closeModal('add-contact')">Cancel</button>
      <button type="button" class="btn btn-primary" onclick="saveContact()">Log Contact</button>
    </div>
  </div>
</div>

<!-- ===== EDIT CONTACT ===== -->
<div id="modal-edit-contact" class="modal-overlay hidden">
  <div class="modal modal-sm">
    <div class="modal-header">
      <h3 class="modal-title">Edit Contact</h3>
      <button class="modal-close" onclick="closeModal('edit-contact')">&times;</button>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Type *</label>
        <select id="edit-contact-type" class="form-select">
          <option value="email">Email</option>
          <option value="meeting">Meeting</option>
          <option value="call">Call</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Date *</label>
        <input type="date" id="edit-contact-date" class="form-input">
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">Details</label>
      <textarea id="edit-contact-details" class="form-textarea" placeholder="Notes…"></textarea>
    </div>
    <div class="form-group">
      <label class="form-label">Satisfaction Score *</label>
      <div class="smiley-selector" id="edit-smileys">
        <div class="smiley-option" data-score="0" onclick="selectSmiley('edit',0)"><span class="smiley-emoji">😞</span><span class="smiley-label">Very Dissatisfied</span></div>
        <div class="smiley-option" data-score="25" onclick="selectSmiley('edit',25)"><span class="smiley-emoji">😕</span><span class="smiley-label">Dissatisfied</span></div>
        <div class="smiley-option" data-score="50" onclick="selectSmiley('edit',50)"><span class="smiley-emoji">😐</span><span class="smiley-label">Neutral</span></div>
        <div class="smiley-option" data-score="75" onclick="selectSmiley('edit',75)"><span class="smiley-emoji">🙂</span><span class="smiley-label">Satisfied</span></div>
        <div class="smiley-option" data-score="100" onclick="selectSmiley('edit',100)"><span class="smiley-emoji">😄</span><span class="smiley-label">Very Satisfied</span></div>
      </div>
      <input type="hidden" id="edit-contact-satisfaction">
    </div>
    <div class="modal-footer">
      <button type="button" class="btn btn-secondary" onclick="closeModal('edit-contact')">Cancel</button>
      <button type="button" class="btn btn-primary" onclick="saveEditContact()">Save Changes</button>
    </div>
  </div>
</div>

<!-- ===== ADD ISSUE ===== -->
<div id="modal-add-issue" class="modal-overlay hidden">
  <div class="modal modal-sm">
    <div class="modal-header">
      <h3 class="modal-title">Add Issue</h3>
      <button class="modal-close" onclick="closeModal('add-issue')">&times;</button>
    </div>
    <div class="form-group">
      <label class="form-label">Title *</label>
      <input type="text" id="inp-issue-title" class="form-input" placeholder="Brief description of the issue">
    </div>
    <div class="form-group">
      <label class="form-label">Description <span style="font-weight:400;color:#9ca3af">(optional)</span></label>
      <textarea id="inp-issue-desc" class="form-textarea" placeholder="Additional details…"></textarea>
    </div>
    <div class="form-group">
      <label class="form-label">Urgency *</label>
      <select id="inp-issue-urgency" class="form-select">
        <option value="">Select…</option>
        <option value="very_high">Very High — resolve within 1 day</option>
        <option value="high">High — resolve within 3 days</option>
        <option value="medium">Medium — resolve within 1 week</option>
        <option value="low">Low — resolve within 1 month</option>
        <option value="very_low">Very Low — resolve within 3 months</option>
      </select>
    </div>
    <div class="modal-footer">
      <button type="button" class="btn btn-secondary" onclick="closeModal('add-issue')">Cancel</button>
      <button type="button" class="btn btn-primary" onclick="saveIssue()">Add Issue</button>
    </div>
  </div>
</div>

<!-- ===== EDIT ISSUE ===== -->
<div id="modal-edit-issue" class="modal-overlay hidden">
  <div class="modal modal-sm">
    <div class="modal-header">
      <h3 class="modal-title">Edit Issue</h3>
      <button class="modal-close" onclick="closeModal('edit-issue')">&times;</button>
    </div>
    <div class="form-group">
      <label class="form-label">Title *</label>
      <input type="text" id="edit-issue-title" class="form-input">
    </div>
    <div class="form-group">
      <label class="form-label">Description</label>
      <textarea id="edit-issue-desc" class="form-textarea"></textarea>
    </div>
    <div class="form-group">
      <label class="form-label">Urgency *</label>
      <select id="edit-issue-urgency" class="form-select">
        <option value="very_high">Very High — resolve within 1 day</option>
        <option value="high">High — resolve within 3 days</option>
        <option value="medium">Medium — resolve within 1 week</option>
        <option value="low">Low — resolve within 1 month</option>
        <option value="very_low">Very Low — resolve within 3 months</option>
      </select>
    </div>
    <div class="modal-footer">
      <button type="button" class="btn btn-secondary" onclick="closeModal('edit-issue')">Cancel</button>
      <button type="button" class="btn btn-primary" onclick="saveEditIssue()">Save Changes</button>
    </div>
  </div>
</div>

<script>
// ==================== ICONS ====================
const ICON_EDIT = `<svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>`;
const ICON_DEL  = `<svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>`;

// ==================== STATE ====================
let clients = [];
let currentClientId = null;
let currentContactId = null;
let currentIssueId = null;
let activeDetailTab = 'contacts';
let activeReport = 'satisfaction';
let listSort = 'default';
let listFilterSize = 'all';
let listFilterType = 'all';
let reportFilters = { satisfactionClientId: '', contactFilter: 'all' };
let satisfactionChart = null;
let contactFreqChart = null;

// ==================== STORAGE ====================
function saveToStorage() { localStorage.setItem('cm_v2_clients', JSON.stringify(clients)); }
function loadFromStorage() {
  try { const d = localStorage.getItem('cm_v2_clients') || localStorage.getItem('cm_v1_clients'); if (d) clients = JSON.parse(d); } catch(e) { clients = []; }
}

// ==================== UTILS ====================
function uid() { return crypto.randomUUID ? crypto.randomUUID() : 'id-' + Math.random().toString(36).slice(2) + Date.now().toString(36); }
function todayStr() { return new Date().toISOString().slice(0,10); }
function daysAgo(s) { if (!s) return 0; return Math.floor((new Date().setHours(0,0,0,0) - new Date(s).setHours(0,0,0,0)) / 86400000); }
function fmtDate(s) { if (!s) return 'Never'; return new Date(s).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}); }
function esc(s) { const d = document.createElement('div'); d.textContent = String(s); return d.innerHTML; }
function getClient(id) { return clients.find(c => c.id === id); }
function sizeLabel(s) { return {small:'Small',medium:'Medium',large:'Large',very_large:'Very Large'}[s]||s; }
function urgencyLabel(u) { return {very_high:'Very High',high:'High',medium:'Medium',low:'Low',very_low:'Very Low'}[u]||u; }
function ctypeIcon(t) { return {email:'📧',meeting:'🤝',call:'📞'}[t]||'📝'; }
function satLabel(v) {
  if (v===null||v===undefined) return 'No data';
  if (v<=12) return 'Very Dissatisfied'; if (v<=37) return 'Dissatisfied';
  if (v<=62) return 'Neutral'; if (v<=87) return 'Satisfied'; return 'Very Satisfied';
}
function satEmoji(v) {
  if (v===null||v===undefined) return '';
  if (v<=0) return '😞'; if (v<=25) return '😕'; if (v<=50) return '😐'; if (v<=75) return '🙂'; return '😄';
}

// ==================== BUSINESS LOGIC ====================
function getRequiredInterval(client) {
  const lowSat = client.satisfactionMeter !== null && client.satisfactionMeter !== undefined && client.satisfactionMeter < 75;
  return client.status === 'pilot' ? (lowSat ? 14 : 21) : (lowSat ? 60 : 90);
}
function getLastContactDate(client) {
  if (!client.contacts.length) return null;
  return [...client.contacts].sort((a,b) => new Date(b.date)-new Date(a.date))[0].date;
}
function getDaysSinceContact(client) { return daysAgo(getLastContactDate(client) || client.createdAt); }
function getContactStatus(client) {
  const days = getDaysSinceContact(client), req = getRequiredInterval(client);
  if (days >= req) return 'overdue'; if (days >= req * 0.75) return 'due_soon'; return 'on_track';
}
function isContactOverdue(client) { return getContactStatus(client) === 'overdue'; }
function getIndicatorColor(client) {
  const st = getContactStatus(client);
  if (st === 'on_track') return 'green';
  if (client.noContactRequired) return 'green';
  return st === 'overdue' ? 'red' : 'orange';
}
function isMeterGrayed(client) { return isContactOverdue(client); }
function satColor(v) { if (v===null||v===undefined) return 'gray'; if (v<=25) return 'red'; if (v<75) return 'orange'; return 'green'; }
function getSatisfactionWarning(client) {
  if (client.satisfactionMeter===null||client.satisfactionMeter===undefined) return null;
  if (client.satisfactionMeter<=25) return 'red'; if (client.satisfactionMeter<75) return 'orange'; return null;
}
function issueMaxDays(u) { return {very_high:1,high:3,medium:7,low:30,very_low:90}[u]||7; }
function isIssueOverdue(issue) { return issue.status!=='resolved' && daysAgo(issue.openedAt||issue.createdAt) > issueMaxDays(issue.urgency); }
function openIssuesCount(client) { return client.issues.filter(i=>i.status==='open').length; }
function overdueIssuesCount(client) { return client.issues.filter(i=>i.status==='open'&&isIssueOverdue(i)).length; }

function recalculateMeter(client) {
  const scored = client.contacts.filter(c=>c.satisfactionScore!==null&&c.satisfactionScore!==undefined)
    .sort((a,b)=>new Date(a.date)-new Date(b.date));
  let meter = null;
  for (const c of scored) meter = meter===null ? c.satisfactionScore : Math.round(0.5*meter+0.5*c.satisfactionScore);
  client.satisfactionMeter = meter;
}

function computeSatHistory(client) {
  const scored = client.contacts.filter(c=>c.satisfactionScore!==null&&c.satisfactionScore!==undefined)
    .sort((a,b)=>new Date(a.date)-new Date(b.date));
  const labels=[],raw=[],meter=[];let cur=null;
  for (const c of scored) {
    labels.push(fmtDate(c.date)); raw.push(c.satisfactionScore);
    cur = cur===null ? c.satisfactionScore : Math.round(0.5*cur+0.5*c.satisfactionScore);
    meter.push(cur);
  }
  return {labels,raw,meter};
}

// ==================== TAB NAVIGATION ====================
function switchTab(tab) {
  document.getElementById('tab-clients').style.display = tab==='clients'?'':'none';
  document.getElementById('tab-reports').style.display = tab==='reports'?'':'none';
  document.querySelectorAll('.nav-tab').forEach((el,i) => el.classList.toggle('active',(i===0&&tab==='clients')||(i===1&&tab==='reports')));
  if (tab==='reports') renderActiveReport();
}
function switchReport(r) {
  activeReport = r;
  document.querySelectorAll('.report-tab').forEach(el => el.classList.toggle('active',(r==='satisfaction'&&el.textContent.includes('Satisfaction'))||(r==='contact-frequency'&&el.textContent.includes('Contact'))));
  renderActiveReport();
}

// ==================== MODAL HELPERS ====================
function openModal(id) { document.getElementById('modal-'+id).classList.remove('hidden'); }
function closeModal(id) { document.getElementById('modal-'+id).classList.add('hidden'); }
document.querySelectorAll('.modal-overlay').forEach(el => el.addEventListener('click', function(e){ if(e.target===this) this.classList.add('hidden'); }));

// ==================== SORT / FILTER ====================
function getFilteredSorted() {
  let list = [...clients];
  if (listFilterSize !== 'all') list = list.filter(c => c.size === listFilterSize);
  if (listFilterType !== 'all') list = list.filter(c => c.status === listFilterType);
  if (listSort === 'sat_low') list.sort((a,b) => { if (a.satisfactionMeter===null) return 1; if (b.satisfactionMeter===null) return -1; return a.satisfactionMeter - b.satisfactionMeter; });
  else if (listSort === 'sat_high') list.sort((a,b) => { if (a.satisfactionMeter===null) return 1; if (b.satisfactionMeter===null) return -1; return b.satisfactionMeter - a.satisfactionMeter; });
  else if (listSort === 'contact_due') list.sort((a,b) => (getDaysSinceContact(b)/getRequiredInterval(b)) - (getDaysSinceContact(a)/getRequiredInterval(a)));
  return list;
}

// ==================== RENDER CLIENT LIST ====================
function renderClients() {
  const container = document.getElementById('clients-list');
  const list = getFilteredSorted();
  if (!clients.length) {
    container.innerHTML = `<div class="empty-state"><div class="empty-icon">👥</div><div>No clients yet. Click <strong>+ Add Client</strong> to get started.</div></div>`;
    return;
  }
  if (!list.length) {
    container.innerHTML = `<div class="empty-state"><div class="empty-icon">🔍</div><div>No clients match the current filters.</div></div>`;
    return;
  }
  container.innerHTML = list.map(renderClientRow).join('');
}

function renderClientRow(client) {
  const indColor = getIndicatorColor(client);
  const cStatus = getContactStatus(client);
  const meter = client.satisfactionMeter;
  const grayed = isMeterGrayed(client);
  const sc = satColor(meter);
  const warn = getSatisfactionWarning(client);
  const days = getDaysSinceContact(client);
  const req = getRequiredInterval(client);
  const lastC = getLastContactDate(client);
  const openI = openIssuesCount(client);
  const overdueI = overdueIssuesCount(client);
  const showNcr = (cStatus==='due_soon'||cStatus==='overdue') && !client.noContactRequired;

  let ctText = '';
  if (cStatus==='on_track') ctText = lastC ? `${days}d ago` : 'No contact yet';
  else if (cStatus==='due_soon') ctText = `Due soon (${days}/${req}d)`;
  else ctText = `Overdue ${lastC?days+'d':'—never'}`;

  const meterHtml = meter !== null ? `
    <div class="${grayed?'meter-grayed':''}">
      <div class="row-meter-label"><span>Satisfaction</span><span>${satLabel(meter)}${grayed?' ⚠':''}</span></div>
      <div class="meter-bar"><div class="meter-fill meter-${sc}" style="width:${meter}%"></div></div>
    </div>` : `
    <div class="row-meter-label"><span>Satisfaction</span><span style="color:#9ca3af">No data</span></div>
    <div class="meter-bar"></div>`;

  const warnHtml = [
    warn==='red' ? `<span class="warning-tag warning-red">⚠ Low Satisfaction</span>` : '',
    warn==='orange' ? `<span class="warning-tag warning-orange">⚠ Below Satisfied</span>` : '',
    overdueI > 0 ? `<span class="warning-tag warning-red">⚠ ${overdueI} Overdue Issue${overdueI>1?'s':''}</span>` : ''
  ].join('');

  return `
    <div class="client-row row-${indColor}" onclick="openClientDetail('${client.id}')">
      <div class="row-dot"><div class="indicator-dot dot-${indColor}"></div></div>
      <div class="row-name">
        <div class="row-client-name">${esc(client.name)}</div>
        <div class="row-badges">
          <span class="badge badge-${client.status}">${client.status==='pilot'?'Pilot':'Client'}</span>
          <span class="badge badge-size-${client.size}">${sizeLabel(client.size)}</span>
        </div>
      </div>
      <div class="row-meter">${meterHtml}</div>
      <div class="row-contact">
        <div class="row-contact-val" style="color:${indColor==='red'?'#dc2626':indColor==='orange'?'#ea580c':'#374151'}">${ctText}</div>
        <div style="font-size:.72rem;color:#9ca3af">Every ${req} days</div>
      </div>
      <div class="row-issues">
        <div style="font-size:.85rem;font-weight:600;color:${overdueI>0?'#dc2626':'#374151'}">${openI}</div>
        <div>open issue${openI!==1?'s':''}</div>
      </div>
      <div class="row-warnings">${warnHtml}</div>
      <div class="row-actions" onclick="event.stopPropagation()">
        ${showNcr ? `<button class="btn btn-sm btn-ncr" onclick="setNoContactRequired('${client.id}')">No Contact Required</button>` : ''}
        ${client.noContactRequired ? `<span class="badge" style="background:#f0fdf4;color:#16a34a;margin-right:4px">NCR</span>` : ''}
        <button class="btn-icon btn-edit" title="Edit client" onclick="openEditClientModal('${client.id}')">${ICON_EDIT}</button>
        <button class="btn-icon btn-del" title="Delete client" onclick="deleteClient('${client.id}')">${ICON_DEL}</button>
      </div>
    </div>`;
}

// ==================== ADD CLIENT ====================
function openAddClientModal() {
  document.getElementById('inp-client-name').value = '';
  document.getElementById('inp-client-size').value = '';
  document.getElementById('inp-client-status').value = 'pilot';
  openModal('add-client');
}
function saveClient() {
  const name = document.getElementById('inp-client-name').value.trim();
  const size = document.getElementById('inp-client-size').value;
  const status = document.getElementById('inp-client-status').value;
  if (!name || !size) { alert('Please fill in all required fields.'); return; }
  clients.push({ id:uid(), name, size, status, satisfactionMeter:null, noContactRequired:false, createdAt:todayStr(), contacts:[], issues:[] });
  saveToStorage(); closeModal('add-client'); renderClients();
}

// ==================== EDIT CLIENT ====================
function openEditClientModal(clientId) {
  const c = getClient(clientId);
  if (!c) return;
  currentClientId = clientId;
  document.getElementById('edit-client-name').value = c.name;
  document.getElementById('edit-client-size').value = c.size;
  document.getElementById('edit-client-status').value = c.status;
  openModal('edit-client');
}
function saveEditClient() {
  const name = document.getElementById('edit-client-name').value.trim();
  const size = document.getElementById('edit-client-size').value;
  const status = document.getElementById('edit-client-status').value;
  if (!name || !size) { alert('Please fill in all required fields.'); return; }
  const c = getClient(currentClientId);
  if (!c) return;
  c.name = name; c.size = size; c.status = status;
  saveToStorage(); closeModal('edit-client'); renderClients();
  if (!document.getElementById('modal-client-detail').classList.contains('hidden')) renderClientDetail();
}

// ==================== DELETE CLIENT ====================
function deleteClient(clientId) {
  const c = getClient(clientId);
  if (!c) return;
  if (!confirm(`Delete "${c.name}"? This cannot be undone.`)) return;
  clients = clients.filter(x => x.id !== clientId);
  saveToStorage(); renderClients();
  if (!document.getElementById('modal-client-detail').classList.contains('hidden') && currentClientId === clientId) closeModal('client-detail');
}

// ==================== NO CONTACT REQUIRED ====================
function setNoContactRequired(clientId) {
  const c = getClient(clientId); if (!c) return;
  c.noContactRequired = true; saveToStorage(); renderClients();
}

// ==================== PROMOTE TO CLIENT ====================
function promoteToClient(clientId) {
  const c = getClient(clientId); if (!c||c.status!=='pilot') return;
  if (!confirm(`Promote "${c.name}" from Pilot to Client?`)) return;
  c.status = 'client'; saveToStorage(); renderClients(); renderClientDetail();
}

// ==================== CLIENT DETAIL ====================
function openClientDetail(clientId) {
  currentClientId = clientId; activeDetailTab = 'contacts';
  renderClientDetail(); openModal('client-detail');
}
function renderClientDetail() {
  const client = getClient(currentClientId); if (!client) return;
  const container = document.getElementById('client-detail-content');
  const indColor = getIndicatorColor(client);
  const cStatus = getContactStatus(client);
  const meter = client.satisfactionMeter;
  const grayed = isMeterGrayed(client);
  const sc = satColor(meter);
  const warn = getSatisfactionWarning(client);
  const req = getRequiredInterval(client);
  const days = getDaysSinceContact(client);
  const lastC = getLastContactDate(client);

  const meterHtml = meter !== null ? `
    <div class="${grayed?'meter-grayed':''}">
      <div class="row-meter-label" style="margin-bottom:5px"><span>Meter</span><span>${satLabel(meter)} (${Math.round(meter)}%)${grayed?' — Unreliable':''}</span></div>
      <div class="meter-bar" style="height:12px"><div class="meter-fill meter-${sc}" style="width:${meter}%"></div></div>
    </div>` : `<span class="text-muted text-sm">No satisfaction data yet.</span>`;

  container.innerHTML = `
    <div class="modal-header">
      <div>
        <h3 class="modal-title">${esc(client.name)}</h3>
        <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;align-items:center">
          <span class="badge badge-size-${client.size}">${sizeLabel(client.size)}</span>
          <span class="badge badge-${client.status}">${client.status==='pilot'?'Pilot':'Client'}</span>
          ${client.status==='pilot'?`<button class="btn btn-sm btn-primary" onclick="promoteToClient('${client.id}')">Promote to Client</button>`:''}
        </div>
      </div>
      <button class="modal-close" onclick="closeModal('client-detail')">&times;</button>
    </div>
    <div class="detail-meta-grid">
      <div>
        <div class="meta-label">Contact Status</div>
        <div class="contact-indicator">
          <div class="indicator-dot dot-${indColor}"></div>
          <span style="color:${indColor==='red'?'#dc2626':indColor==='orange'?'#ea580c':'#16a34a'};font-weight:600;font-size:.85rem">${cStatus.replace('_',' ')}</span>
        </div>
        <div class="meta-value" style="font-size:.78rem;color:#6b7280">Required every ${req} days<br>Last: ${lastC?fmtDate(lastC)+' ('+days+'d ago)':'Never'}<br>Created: ${fmtDate(client.createdAt)}</div>
      </div>
      <div><div class="meta-label">Satisfaction</div>${meterHtml}</div>
    </div>
    ${warn?`<div class="warnings-inline">${warn==='red'?'<span class="warning-tag warning-red">⚠ Low Satisfaction — immediate attention required</span>':'<span class="warning-tag warning-orange">⚠ Below Satisfied — increased contact schedule active</span>'}</div>`:''}
    <div class="detail-tabs">
      <button class="detail-tab${activeDetailTab==='contacts'?' active':''}" onclick="switchDetailTab('contacts')">Contacts (${client.contacts.length})</button>
      <button class="detail-tab${activeDetailTab==='issues'?' active':''}" onclick="switchDetailTab('issues')">Issues (${openIssuesCount(client)} open)</button>
    </div>
    <div id="detail-tab-content">
      ${activeDetailTab==='contacts'?renderContactsTab(client):renderIssuesTab(client)}
    </div>`;
}
function switchDetailTab(tab) {
  activeDetailTab = tab;
  const client = getClient(currentClientId);
  const el = document.getElementById('detail-tab-content');
  if (el && client) el.innerHTML = tab==='contacts'?renderContactsTab(client):renderIssuesTab(client);
  document.querySelectorAll('.detail-tab').forEach(btn => btn.classList.toggle('active',(tab==='contacts'&&btn.textContent.includes('Contact'))||(tab==='issues'&&btn.textContent.includes('Issue'))));
}

// ==================== CONTACTS TAB ====================
function renderContactsTab(client) {
  let html = `<div class="detail-section-header"><span class="detail-section-title">Contact History</span><button class="btn btn-primary btn-sm" onclick="openAddContactModal('${client.id}')">+ Log Contact</button></div>`;
  if (!client.contacts.length) return html + `<div class="no-data">No contacts logged yet.</div>`;
  const sorted = [...client.contacts].sort((a,b) => new Date(b.date)-new Date(a.date));
  return html + sorted.map(c => `
    <div class="contact-item">
      <div class="contact-icon ci-${c.type}">${ctypeIcon(c.type)}</div>
      <div style="flex:1">
        <div class="contact-type-label">${c.type}</div>
        <div class="contact-date-label">${fmtDate(c.date)}</div>
        ${c.details?`<div class="contact-details-text">${esc(c.details)}</div>`:''}
        ${c.satisfactionScore!==null&&c.satisfactionScore!==undefined?`<div class="contact-score-text">Satisfaction: ${satLabel(c.satisfactionScore)} ${satEmoji(c.satisfactionScore)}</div>`:''}
        <div class="item-actions">
          <button class="btn-icon btn-edit" title="Edit contact" onclick="openEditContactModal('${client.id}','${c.id}')">${ICON_EDIT}</button>
          <button class="btn-icon btn-del" title="Delete contact" onclick="deleteContact('${client.id}','${c.id}')">${ICON_DEL}</button>
        </div>
      </div>
    </div>`).join('');
}

// ==================== ISSUES TAB ====================
function renderIssuesTab(client) {
  let html = `<div class="detail-section-header"><span class="detail-section-title">Issues</span><button class="btn btn-primary btn-sm" onclick="openAddIssueModal('${client.id}')">+ Add Issue</button></div>`;
  if (!client.issues.length) return html + `<div class="no-data">No issues recorded.</div>`;
  const open = client.issues.filter(i=>i.status==='open');
  const resolved = client.issues.filter(i=>i.status==='resolved');
  if (open.length) html += `<div class="group-label">Open</div>` + open.map(i=>renderIssueItem(client,i)).join('');
  if (resolved.length) html += `<div class="group-label">Resolved</div>` + resolved.map(i=>renderIssueItem(client,i)).join('');
  return html;
}
function renderIssueItem(client, issue) {
  const ov = isIssueOverdue(issue);
  const maxD = issueMaxDays(issue.urgency);
  const daysSince = daysAgo(issue.openedAt||issue.createdAt);
  return `
    <div class="issue-item${ov?' ov':''}${issue.status==='resolved'?' resolved-item':''}">
      <div class="issue-header">
        <span class="issue-title">${esc(issue.title)}</span>
        ${ov?`<span class="overdue-label">OVERDUE</span>`:''}
      </div>
      ${issue.description?`<div class="text-sm text-muted" style="margin-bottom:8px">${esc(issue.description)}</div>`:''}
      <div class="issue-meta">
        <span class="urgency-badge u-${issue.urgency}">${urgencyLabel(issue.urgency)}</span>
        <span class="badge ${issue.status==='open'?'status-open':'status-resolved'}">${issue.status}</span>
        <span class="text-sm text-muted">Day ${daysSince} of ${maxD}</span>
        ${issue.raisedAgainHistory?.length?`<span class="raised-count">Raised again: ${issue.raisedAgainHistory.length}×</span>`:''}
      </div>
      <div class="item-actions">
        ${issue.status==='open'?`
          <button class="btn btn-sm btn-secondary" onclick="raiseIssueAgain('${client.id}','${issue.id}')">Raised Again</button>
          <button class="btn btn-sm btn-success" onclick="resolveIssue('${client.id}','${issue.id}')">Resolve</button>
        `:`<button class="btn btn-sm btn-warning" onclick="reopenIssue('${client.id}','${issue.id}')">Reopen</button>`}
        <button class="btn-icon btn-edit" title="Edit issue" onclick="openEditIssueModal('${client.id}','${issue.id}')">${ICON_EDIT}</button>
        <button class="btn-icon btn-del" title="Delete issue" onclick="deleteIssue('${client.id}','${issue.id}')">${ICON_DEL}</button>
      </div>
    </div>`;
}

// ==================== ADD CONTACT ====================
function openAddContactModal(clientId) {
  currentClientId = clientId;
  document.getElementById('inp-contact-type').value = '';
  document.getElementById('inp-contact-date').value = todayStr();
  document.getElementById('inp-contact-details').value = '';
  document.getElementById('inp-contact-satisfaction').value = '';
  document.querySelectorAll('#add-smileys .smiley-option').forEach(el => el.classList.remove('selected'));
  openModal('add-contact');
}
function selectSmiley(ctx, score) {
  const prefix = ctx === 'add' ? 'add' : 'edit';
  const inputId = ctx === 'add' ? 'inp-contact-satisfaction' : 'edit-contact-satisfaction';
  document.getElementById(inputId).value = score;
  document.querySelectorAll(`#${prefix}-smileys .smiley-option`).forEach(el => el.classList.toggle('selected', parseInt(el.dataset.score) === score));
}
function saveContact() {
  const type = document.getElementById('inp-contact-type').value;
  const date = document.getElementById('inp-contact-date').value;
  const details = document.getElementById('inp-contact-details').value.trim();
  const satVal = document.getElementById('inp-contact-satisfaction').value;
  if (!type || !date) { alert('Please select a contact type and date.'); return; }
  if (satVal === '') { alert('Please select a satisfaction score.'); return; }
  const client = getClient(currentClientId); if (!client) return;
  client.contacts.push({ id:uid(), type, date, details, satisfactionScore:parseInt(satVal) });
  client.noContactRequired = false;
  recalculateMeter(client);
  saveToStorage(); closeModal('add-contact'); renderClients();
  if (!document.getElementById('modal-client-detail').classList.contains('hidden')) renderClientDetail();
}

// ==================== EDIT CONTACT ====================
function openEditContactModal(clientId, contactId) {
  const client = getClient(clientId); if (!client) return;
  const c = client.contacts.find(x => x.id === contactId); if (!c) return;
  currentClientId = clientId; currentContactId = contactId;
  document.getElementById('edit-contact-type').value = c.type;
  document.getElementById('edit-contact-date').value = c.date;
  document.getElementById('edit-contact-details').value = c.details || '';
  const score = c.satisfactionScore;
  document.getElementById('edit-contact-satisfaction').value = score !== null && score !== undefined ? score : '';
  document.querySelectorAll('#edit-smileys .smiley-option').forEach(el => el.classList.toggle('selected', parseInt(el.dataset.score) === score));
  openModal('edit-contact');
}
function saveEditContact() {
  const type = document.getElementById('edit-contact-type').value;
  const date = document.getElementById('edit-contact-date').value;
  const details = document.getElementById('edit-contact-details').value.trim();
  const satVal = document.getElementById('edit-contact-satisfaction').value;
  if (!type || !date) { alert('Please fill in type and date.'); return; }
  if (satVal === '') { alert('Please select a satisfaction score.'); return; }
  const client = getClient(currentClientId); if (!client) return;
  const c = client.contacts.find(x => x.id === currentContactId); if (!c) return;
  c.type = type; c.date = date; c.details = details; c.satisfactionScore = parseInt(satVal);
  recalculateMeter(client);
  saveToStorage(); closeModal('edit-contact'); renderClients();
  if (!document.getElementById('modal-client-detail').classList.contains('hidden')) renderClientDetail();
}

// ==================== DELETE CONTACT ====================
function deleteContact(clientId, contactId) {
  if (!confirm('Delete this contact entry?')) return;
  const client = getClient(clientId); if (!client) return;
  client.contacts = client.contacts.filter(c => c.id !== contactId);
  recalculateMeter(client);
  saveToStorage(); renderClients();
  if (!document.getElementById('modal-client-detail').classList.contains('hidden')) renderClientDetail();
}

// ==================== ADD ISSUE ====================
function openAddIssueModal(clientId) {
  currentClientId = clientId;
  document.getElementById('inp-issue-title').value = '';
  document.getElementById('inp-issue-desc').value = '';
  document.getElementById('inp-issue-urgency').value = '';
  openModal('add-issue');
}
function saveIssue() {
  const title = document.getElementById('inp-issue-title').value.trim();
  const desc = document.getElementById('inp-issue-desc').value.trim();
  const urgency = document.getElementById('inp-issue-urgency').value;
  if (!title || !urgency) { alert('Please fill in title and urgency.'); return; }
  const client = getClient(currentClientId); if (!client) return;
  const t = todayStr();
  client.issues.push({ id:uid(), title, description:desc, urgency, status:'open', raisedAgainHistory:[], createdAt:t, openedAt:t, resolvedAt:null });
  saveToStorage(); closeModal('add-issue'); renderClients();
  if (!document.getElementById('modal-client-detail').classList.contains('hidden')) { activeDetailTab='issues'; renderClientDetail(); }
}

// ==================== EDIT ISSUE ====================
function openEditIssueModal(clientId, issueId) {
  const client = getClient(clientId); if (!client) return;
  const issue = client.issues.find(i => i.id === issueId); if (!issue) return;
  currentClientId = clientId; currentIssueId = issueId;
  document.getElementById('edit-issue-title').value = issue.title;
  document.getElementById('edit-issue-desc').value = issue.description || '';
  document.getElementById('edit-issue-urgency').value = issue.urgency;
  openModal('edit-issue');
}
function saveEditIssue() {
  const title = document.getElementById('edit-issue-title').value.trim();
  const desc = document.getElementById('edit-issue-desc').value.trim();
  const urgency = document.getElementById('edit-issue-urgency').value;
  if (!title || !urgency) { alert('Please fill in title and urgency.'); return; }
  const issue = getClient(currentClientId)?.issues.find(i => i.id === currentIssueId); if (!issue) return;
  issue.title = title; issue.description = desc; issue.urgency = urgency;
  saveToStorage(); closeModal('edit-issue'); renderClients();
  if (!document.getElementById('modal-client-detail').classList.contains('hidden')) renderClientDetail();
}

// ==================== DELETE ISSUE ====================
function deleteIssue(clientId, issueId) {
  if (!confirm('Delete this issue?')) return;
  const client = getClient(clientId); if (!client) return;
  client.issues = client.issues.filter(i => i.id !== issueId);
  saveToStorage(); renderClients();
  if (!document.getElementById('modal-client-detail').classList.contains('hidden')) renderClientDetail();
}

// ==================== ISSUE ACTIONS ====================
function raiseIssueAgain(clientId, issueId) {
  const issue = getClient(clientId)?.issues.find(i=>i.id===issueId); if (!issue) return;
  (issue.raisedAgainHistory = issue.raisedAgainHistory||[]).push(todayStr());
  saveToStorage(); renderClients();
  if (!document.getElementById('modal-client-detail').classList.contains('hidden')) renderClientDetail();
}
function resolveIssue(clientId, issueId) {
  const issue = getClient(clientId)?.issues.find(i=>i.id===issueId); if (!issue) return;
  issue.status='resolved'; issue.resolvedAt=todayStr();
  saveToStorage(); renderClients();
  if (!document.getElementById('modal-client-detail').classList.contains('hidden')) renderClientDetail();
}
function reopenIssue(clientId, issueId) {
  const issue = getClient(clientId)?.issues.find(i=>i.id===issueId); if (!issue) return;
  issue.status='open'; issue.openedAt=todayStr(); issue.resolvedAt=null;
  saveToStorage(); renderClients();
  if (!document.getElementById('modal-client-detail').classList.contains('hidden')) renderClientDetail();
}

// ==================== REPORTS ====================
function renderActiveReport() {
  const container = document.getElementById('report-content');
  if (activeReport==='satisfaction') renderSatisfactionReport(container);
  else renderContactFreqReport(container);
}
function renderSatisfactionReport(container) {
  const opts = clients.map(c=>`<option value="${c.id}"${reportFilters.satisfactionClientId===c.id?' selected':''}>${esc(c.name)}</option>`).join('');
  container.innerHTML = `<div class="report-card"><div class="report-controls"><label style="font-size:.875rem;font-weight:600">Client:</label><select class="form-select" style="width:220px" onchange="onSelectSatClient(this.value)"><option value="">Select a client…</option>${opts}</select></div><div id="sat-chart-area">${reportFilters.satisfactionClientId?'<div class="chart-container"><canvas id="sat-chart"></canvas></div>':'<div class="no-data" style="padding:60px">Select a client to view their satisfaction history.</div>'}</div></div>`;
  if (reportFilters.satisfactionClientId) drawSatChart();
}
function onSelectSatClient(val) {
  reportFilters.satisfactionClientId = val;
  const area = document.getElementById('sat-chart-area');
  if (val) { area.innerHTML='<div class="chart-container"><canvas id="sat-chart"></canvas></div>'; drawSatChart(); }
  else { if(satisfactionChart){satisfactionChart.destroy();satisfactionChart=null;} area.innerHTML='<div class="no-data" style="padding:60px">Select a client to view their satisfaction history.</div>'; }
}
function drawSatChart() {
  const client = getClient(reportFilters.satisfactionClientId); if (!client) return;
  const {labels,raw,meter} = computeSatHistory(client);
  if (!labels.length) { document.getElementById('sat-chart-area').innerHTML='<div class="no-data" style="padding:60px">No satisfaction scores logged yet.</div>'; return; }
  if (satisfactionChart) { satisfactionChart.destroy(); satisfactionChart=null; }
  const ctx = document.getElementById('sat-chart').getContext('2d');
  satisfactionChart = new Chart(ctx,{type:'line',data:{labels,datasets:[
    {label:'Raw Score per Contact',data:raw,borderColor:'#60a5fa',backgroundColor:'rgba(96,165,250,.15)',borderWidth:2,pointRadius:5,tension:.3},
    {label:'Satisfaction Meter',data:meter,borderColor:'#16a34a',backgroundColor:'rgba(22,163,74,.1)',borderWidth:2.5,pointRadius:5,tension:.3}
  ]},options:{responsive:true,maintainAspectRatio:false,scales:{y:{min:0,max:100,ticks:{stepSize:25,callback:v=>({0:'Very Dissatisfied',25:'Dissatisfied',50:'Neutral',75:'Satisfied',100:'Very Satisfied'})[v]||v}}},plugins:{legend:{display:true,position:'top'},tooltip:{callbacks:{label:ctx=>`${ctx.dataset.label}: ${satLabel(ctx.parsed.y)} (${ctx.parsed.y})`}}}}});
}
function renderContactFreqReport(container) {
  const f = reportFilters.contactFilter||'all';
  container.innerHTML=`<div class="report-card"><div class="report-controls"><label style="font-size:.875rem;font-weight:600">Filter:</label><select class="form-select" style="width:180px" onchange="onContactFilter(this.value)"><option value="all"${f==='all'?' selected':''}>All</option><option value="pilot"${f==='pilot'?' selected':''}>Pilots Only</option><option value="client"${f==='client'?' selected':''}>Clients Only</option></select></div><div class="chart-container"><canvas id="freq-chart"></canvas></div></div>`;
  drawFreqChart();
}
function onContactFilter(val) { reportFilters.contactFilter=val; if(contactFreqChart){contactFreqChart.destroy();contactFreqChart=null;} drawFreqChart(); }
function drawFreqChart() {
  const f=reportFilters.contactFilter||'all';
  let list=clients; if(f==='pilot')list=clients.filter(c=>c.status==='pilot'); if(f==='client')list=clients.filter(c=>c.status==='client');
  const canvas=document.getElementById('freq-chart'); if(!canvas)return;
  if(!list.length){canvas.parentElement.innerHTML='<div class="no-data" style="padding:60px">No clients match this filter.</div>';return;}
  if(contactFreqChart){contactFreqChart.destroy();contactFreqChart=null;}
  const ctx=canvas.getContext('2d');
  contactFreqChart=new Chart(ctx,{data:{labels:list.map(c=>c.name),datasets:[
    {type:'bar',label:'Days Since Last Contact',data:list.map(c=>getDaysSinceContact(c)),backgroundColor:list.map(c=>{const st=getContactStatus(c);return st==='overdue'?'rgba(220,38,38,.75)':st==='due_soon'?'rgba(234,88,12,.75)':'rgba(22,163,74,.75)';}),borderRadius:4},
    {type:'line',label:'Required Interval',data:list.map(c=>getRequiredInterval(c)),borderColor:'#94a3b8',borderWidth:2,borderDash:[6,4],pointRadius:0,fill:false}
  ]},options:{responsive:true,maintainAspectRatio:false,scales:{y:{beginAtZero:true,title:{display:true,text:'Days'}}},plugins:{legend:{display:true,position:'top'},tooltip:{callbacks:{label:ctx=>ctx.datasetIndex===0?`Days since contact: ${ctx.parsed.y}`:`Required interval: ${ctx.parsed.y} days`}}}}});
}

// ==================== INIT ====================
loadFromStorage();
renderClients();
</script>
